<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AgriPredict</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f4fbf7;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .contact-container {
            background: #ffffff;
            width: 100%;
            max-width: 900px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
        }
        .contact-info {
            background: #2e7d32;
            color: #ffffff;
            flex: 1;
            min-width: 300px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .contact-info h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        .contact-info p {
            font-size: 14px;
            color: #e8f5e9;
            line-height: 1.6;
        }
        .info-list {
            list-style: none;
            margin: 30px 0;
        }
        .info-list li {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .info-list i {
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 50%;
        }
        .contact-form {
            flex: 1.2;
            min-width: 300px;
            padding: 40px;
        }
        .contact-form h3 {
            color: #1b5e20;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #2e7d32;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background: #1b5e20;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover {
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <!-- डाव्या बाजूला संपर्क माहिती -->
        <div class="contact-info">
            <div>
                <h2>Get in Touch</h2>
                <p>Have questions about crop prediction or recommendations? Send us a message!</p>
                
                <ul class="info-list">
                    <li>
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Maharashtra, India</span>
                    </li>
                    <li>
                        <i class="fa-solid fa-envelope"></i>
                        <span>support@agripredict.com</span>
                    </li>
                    <li>
                        <i class="fa-solid fa-phone"></i>
                        <span>+91 98765 43210</span>
                    </li>
                </ul>
            </div>

            <a href="{{ url_for('home') }}" class="back-link" style="color: #fff;"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
        </div>

        <!-- उजव्या बाजूला संपर्क फॉर्म -->
        <div class="contact-form">
            <h3>Send Message</h3>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" rows="4" placeholder="Type your message here..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Send Message <i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

</body>
</html>
