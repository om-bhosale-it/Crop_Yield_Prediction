<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Yield Result</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #e8f5e9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        .icon {
            font-size: 50px;
            color: #2e7d32;
            margin-bottom: 15px;
        }
        h1 {
            color: #1b5e20;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .crop-name {
            font-size: 18px;
            color: #555;
            margin-bottom: 20px;
        }
        .crop-name strong {
            color: #2e7d32;
        }
        .result-box {
            background: #f1f8e9;
            border: 2px dashed #4caf50;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        .result-box label {
            display: block;
            font-size: 14px;
            color: #558b2f;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .result-box span {
            font-size: 32px;
            font-weight: 700;
            color: #1b5e20;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-primary {
            background: #2e7d32;
            color: white;
        }
        .btn-primary:hover {
            background: #1b5e20;
        }
        .btn-secondary {
            background: #f5f5f5;
            color: #444;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🌾</div>
        <h1>Yield Prediction Result</h1>
        <p class="crop-name">Selected Crop: <strong>{{ crop }}</strong></p>

        <div class="result-box">
            <label>Estimated Crop Yield</label>
            <span>{{ prediction }} Qtl/Acre</span>
        </div>

        <div class="btn-group">
            <!-- पुढील टप्प्यावर (Fertilizer Form) जाण्यासाठी लिंक -->
            <a href="{{ url_for('fertilizer', crop=crop) }}" class="btn btn-primary">
                Get Fertilizer & Weed Recommendation <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- होम पेजवर परत जाण्यासाठी लिंक -->
            <a href="{{ url_for('home') }}" class="btn btn-secondary">
                <i class="fa-solid fa-house"></i> Back to Home
            </a>
        </div>
    </div>

</body>
</html>
