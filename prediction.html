<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Yield Predictor - AgriPredict</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4fbf7;
            padding: 40px 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .pred-container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .pred-container h2 {
            color: #1b5e20;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1b5e20;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="pred-container">
        <h2>AI Yield Predictor</h2>
        <form action="/predict" method="POST">
            <div class="form-group">
                <label>Select Crop</label>
                <select name="crop" required>
                    <option value="">-- Select Crop --</option>
                    <option value="Sugarcane">Sugarcane</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Rice">Rice</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Maize">Maize</option>
                </select>
            </div>
            <div class="form-group">
                <label>Rainfall (mm)</label>
                <input type="number" name="rainfall" step="any" placeholder="e.g. 1200" required>
            </div>
            <div class="form-group">
                <label>Temperature (°C)</label>
                <input type="number" name="temperature" step="any" placeholder="e.g. 28" required>
            </div>
            <div class="form-group">
                <label>Humidity (%)</label>
                <input type="number" name="humidity" step="any" placeholder="e.g. 70" required>
            </div>
            <button type="submit" class="btn-submit">Predict Yield</button>
        </form>
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
    </div>

</body>
</html>
