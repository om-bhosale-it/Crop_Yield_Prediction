<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AgriPredict</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f4fbf7;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header i {
            font-size: 35px;
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .header h2 {
            color: #1b5e20;
            font-size: 24px;
        }
        .header p {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-box i {
            position: absolute;
            left: 12px;
            color: #2e7d32;
            font-size: 14px;
        }
        .input-box input {
            width: 100%;
            padding: 11px 11px 11px 36px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .input-box input:focus {
            border-color: #2e7d32;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1b5e20;
        }
        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        .footer-links a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 600;
        }
        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #777;
            text-decoration: none;
        }
        .back-home:hover {
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="header">
            <i class="fa-solid fa-wheat-awn"></i>
            <h2>Create Account</h2>
            <p>Join AgriPredict for smart farming insights</p>
        </div>

        <form action="/register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" name="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Create a password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Register Now <i class="fa-solid fa-arrow-right"></i></button>
        </form>

        <a href="{{ url_for('home') }}" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>

</body>
</html>
